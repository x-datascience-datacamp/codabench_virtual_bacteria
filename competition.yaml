version: 2
title: "Datacamp 2026 - Bacterial Gene Expression — predict RNA-seq counts across species"
description: >
  Predict RNA-seq expression counts for a gene x sample observation from its
  genome sequence, gene description and experimental (environment) metadata.
  Submissions are code (a benchopt solver) that engineers features and trains
  on the platform, outputting (mu, sigma) per observation. Ranking is by mean
  Negative-Binomial NLL (capped at 100 per observation), averaged over three
  held-out regions: a known gene in a known run never seen together (A), a
  new run (B) and a new gene (C).
  The leaderboard shows a public half of each region, and the final ranking
  uses the hidden private half. Powered by benchopt.
image: logo.png
registration_auto_approve: False

# The image submissions run in; it carries the requirements.txt stack.
docker_image: tommoral/bacteria-compet:v1

# Only the leaderboard metrics are exposed.
enable_detailed_results: False
show_detailed_results_in_submission_panel: False
show_detailed_results_in_leaderboard: False

terms: pages/terms.md
pages:
  - title: Overview
    file: pages/overview.md
  - title: Participation
    file: pages/participate.md
  - title: Timeline
    file: pages/timeline.md

tasks:
  - index: 0
    name: Gene expression
    description: >
      The ingestion program runs the bundled benchopt benchmark on your
      submission (training on the platform); scoring parses the results.
    input_data: main_phase/input_data/
    reference_data: main_phase/reference_data/
    ingestion_program: ingestion_program/
    scoring_program: scoring_program/

solutions:
  - index: 0
    tasks:
      - 0
    path: solution/

# Dates are UTC+0, in the documented YYYY-MM-DD HH:MM:SS format.
phases:
  - index: 0
    name: Competition
    description: >
      Build, train and submit your model. The leaderboard shows the public half
      of each region. The final ranking is the NB-NLL averaged over regions
      A, B and C of the hidden private half.
    start: 2026-10-29 00:00:00
    end: 2027-02-01 00:00:00
    execution_time_limit: 3600
    max_submissions_per_day: 5
    # results.parquet and scores.json carry the hidden private metrics.
    hide_prediction_output: True
    hide_score_output: True
    tasks:
      - 0

leaderboards:
  - title: Results
    key: main
    columns:
      - title: NB-NLL (Challenge, public)
        key: nb_nll
        index: 0
        sorting: asc
      - title: MAE (Challenge, public)
        key: mae
        index: 1
        sorting: asc
      - title: R2 (Challenge, public)
        key: r2
        index: 2
        sorting: desc
      - title: "NB-NLL (A: unseen pair)"
        key: nb_nll_A
        index: 3
        sorting: asc
      - title: "NB-NLL (B: new run)"
        key: nb_nll_B
        index: 4
        sorting: asc
      - title: "NB-NLL (C: new gene)"
        key: nb_nll_C
        index: 5
        sorting: asc
      - title: "NB-NLL (D: new gene, new run)"
        key: nb_nll_D
        index: 6
        sorting: asc
      - title: NB-NLL (Challenge, private)
        key: nb_nll_private
        index: 7
        sorting: asc
        hidden: True
      - title: MAE (Challenge, private)
        key: mae_private
        index: 8
        sorting: asc
        hidden: True
      - title: R2 (Challenge, private)
        key: r2_private
        index: 9
        sorting: desc
        hidden: True
      - title: NB-NLL (A, private)
        key: nb_nll_A_private
        index: 10
        sorting: asc
        hidden: True
      - title: NB-NLL (B, private)
        key: nb_nll_B_private
        index: 11
        sorting: asc
        hidden: True
      - title: NB-NLL (C, private)
        key: nb_nll_C_private
        index: 12
        sorting: asc
        hidden: True
      - title: NB-NLL (D, private)
        key: nb_nll_D_private
        index: 13
        sorting: asc
        hidden: True
      - title: Duration (s)
        key: duration
        index: 14
        sorting: asc
