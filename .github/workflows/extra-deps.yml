# Builds tools/Dockerfile.extra on the running image, so a dependency that
# does not fit its frozen stack fails here rather than at deploy time. On main,
# pushes it as the competition image: workers pull it on the next submission.
name: Extra deps

on:
  push:
    branches: [main]
    paths: [extra-deps.txt, tools/Dockerfile.extra, .github/workflows/extra-deps.yml]
  pull_request:
    paths: [extra-deps.txt, tools/Dockerfile.extra, .github/workflows/extra-deps.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
      - uses: actions/checkout@v4
      - name: Build tools/Dockerfile.extra on the running image
        run: docker build -f tools/Dockerfile.extra -t extra-deps-test .
      - name: Push as the competition image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          image=$(sed -n 's/^docker_image: *//p' competition.yaml)
          echo "$DOCKERHUB_TOKEN" | docker login -u "${image%%/*}" --password-stdin
          docker tag extra-deps-test "$image"
          docker push "$image"
