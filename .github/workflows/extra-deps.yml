# Builds tools/Dockerfile.extra on the running image, so a dependency that
# does not fit its frozen stack fails here rather than at deploy time.
name: Extra deps

on:
  push:
    branches: [main]
    paths: [extra-deps.txt, tools/Dockerfile.extra, .github/workflows/extra-deps.yml]
  pull_request:
    paths: [extra-deps.txt, tools/Dockerfile.extra, .github/workflows/extra-deps.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
      - uses: actions/checkout@v4
      - name: Build tools/Dockerfile.extra on the running image
        run: docker build -f tools/Dockerfile.extra -t extra-deps-test .
